[package]
name = "lexicue"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Linux-first terminal with intent-based command resolution"
license = "MIT"

[[bin]]
name = "lexicue"
path = "src/main.rs"

# Dependency policy: versions are pinned on purpose (no major upgrades unless the
# contract changes). Every third-party type stays behind its adapter module.
[dependencies]
eframe = "0.29"                 # GUI; only src/ui/* and src/app.rs may touch egui types
portable-pty = "0.8"            # PTY; adapter only in src/pty/portable.rs
vt100 = "0.15"                  # screen buffer; adapter only in src/pty/vt.rs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
thiserror = "1"
regex = "1"
strsim = "0.11"
shlex = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
png = "0.18"
flate2 = "1"

# Only for `kill(-pgid, sig)`: the PTY child leads its own session, so terminating
# the group is the only way to reap the grandchildren it leaves behind.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
